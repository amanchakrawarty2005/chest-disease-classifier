name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile src/config.py src/data_preprocessing.py src/model.py src/train.py src/evaluate.py src/gradcam.py
          python -m py_compile api/main.py api/inference.py api/schemas.py dashboard/app.py

      - name: Unit tests
        run: |
          python -m pytest -q tests/test_data_preprocessing.py tests/test_evaluate_helpers.py
